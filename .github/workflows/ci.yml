name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3, mbstring, intl, zip, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (formato)
        run: vendor/bin/pint --test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Assets (Vite)
        run: npm run build

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  migrations-mysql:
    # Las migraciones deben correr en MySQL desde cero (sqlite ignora `after()` y otros detalles de MySQL).
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tapandgo_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql, mbstring, intl, zip, bcmath
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Migrar desde cero en MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tapandgo_ci
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

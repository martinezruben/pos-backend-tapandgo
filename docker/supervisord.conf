[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=/bin/sh -c "while true; do (cd /var/www/html && php artisan schedule:run); sleep 60; done"
; Mismo usuario que php-fpm: los logs y la caché quedan escribibles para la web
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Worker de colas (QUEUE_CONNECTION=database): correos de contingencia y aviso de NCF.
; --max-time reinicia el proceso cada hora para liberar memoria y tomar código nuevo.
[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --backoff=30 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
